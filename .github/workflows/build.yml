name: Build

# Validates project data and builds the static site on every push / PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate & build
        # SITE_URL is a repository *variable* (Settings → Secrets and variables → Actions → Variables).
        # Leave it unset until the domain is known; canonical/OG/sitemap URLs are then omitted.
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
