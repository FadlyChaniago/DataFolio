# /etc/nginx/sites-available/datafolio
# Static Datafolio site. Replace YOUR_DOMAIN, then:
#   sudo ln -s /etc/nginx/sites-available/datafolio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR_DOMAIN          # Let's Encrypt; certbot adds the 443 block + redirect

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Points at the symlink the deploy workflow swaps atomically.
    root /var/www/datafolio/current;
    index index.html;

    # Security headers (static site: no inline event handlers, no third-party scripts).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Hashed build assets never change → cache for a year.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Project screenshots: cache a week (rename the file when you replace it).
    location /images/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # HTML always revalidates so a new deploy shows up immediately.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ $uri.html =404;
    }

    # Never serve dotfiles.
    location ~ /\. { deny all; }
}
